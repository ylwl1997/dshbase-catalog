name: Sync catalog from dshbase

on:
  schedule:
    - cron: '37 5 * * *'  # 每天 05:37 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Fetch dshbase plugins.json and regenerate catalog
        run: |
          curl -s https://raw.githubusercontent.com/ylwl1997/dshbase/main/src/data/plugins.json -o /tmp/plugins.json
          python scripts/sync-catalog.py /tmp/plugins.json src/catalog.json

      - name: Check for data change (compare plugin list, ignore `updated` date)
        id: check
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          new = json.load(open('src/catalog.json', encoding='utf-8'))
          try:
              old = json.loads(subprocess.run(['git', 'show', 'HEAD:src/catalog.json'],
                                              capture_output=True, text=True, check=True).stdout)
              old_plugins = json.dumps(old.get('plugins', []), sort_keys=True, ensure_ascii=False)
          except Exception:
              old_plugins = None
          new_plugins = json.dumps(new.get('plugins', []), sort_keys=True, ensure_ascii=False)
          changed = old_plugins is None or new_plugins != old_plugins
          print('changed=' + ('true' if changed else 'false'))
          PY

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Bump patch version (based on npm latest, self-healing)
        if: steps.check.outputs.changed == 'true'
        run: |
          CUR=$(node -p "require('./package.json').version")
          LATEST=$(npm view dshbase-catalog version 2>/dev/null || echo "$CUR")
          NEXT=$(node -e "const v=process.argv[1].split('.').map(Number); console.log(v[0]+'.'+v[1]+'.'+(v[2]+1))" "$LATEST")
          echo "bumping $LATEST -> $NEXT"
          npm version "$NEXT" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        if: steps.check.outputs.changed == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and push (catalog.json + version)
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catalog.json package.json package-lock.json
          git commit -m "chore: sync catalog + publish $(node -p "require('./package.json').version") ($(date -u +%Y-%m-%d))"
          git push

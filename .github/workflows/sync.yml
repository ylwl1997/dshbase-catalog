name: Sync catalog from dshbase

on:
  schedule:
    - cron: '37 5 * * *'  # 每天 05:37 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch dshbase plugins.json and regenerate catalog
        run: |
          curl -s https://raw.githubusercontent.com/ylwl1997/dshbase/main/src/data/plugins.json -o /tmp/plugins.json
          python scripts/sync-catalog.py /tmp/plugins.json src/catalog.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/catalog.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: sync catalog ($(date -u +%Y-%m-%d))"
            git push
          fi

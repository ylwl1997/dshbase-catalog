name: E2E install test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dsh + pnpm
        run: npm install -g @deepseek-ai/dsh pnpm

      - name: Set up profile with catalog
        run: |
          export DSH_HOME=/tmp/dshhome
          mkdir -p "$DSH_HOME"
          printf 'DEEPSEEK_API_KEY: %s\n' "${{ secrets.DEEPSEEK_API_KEY }}" > "$DSH_HOME/.credentials.yaml"
          dsh plugin --profile e2e add @deepseek-ai/dsh-base@0.1.0-rc.6 @deepseek-ai/dsh-headless@0.1.0-rc.6 dshbase-catalog
          echo "--- profile bundles ---"
          cat "$DSH_HOME/profiles/e2e/package.json"

      - name: Run end-to-end install test
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_HOME: /tmp/dshhome
        run: |
          dsh --profile e2e "Use the search_dsh_plugins tool to find a memory plugin, use get_dsh_plugin to get its install command, then run that install command with your bash tool, and finally confirm whether the installation succeeded."
